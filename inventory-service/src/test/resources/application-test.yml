spring:
  datasource:
    url: jdbc:h2:mem:inventory;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  kafka:
    bootstrap-servers: localhost:1
    listener:
      auto-startup: false

outbox:
  poll-interval: PT1H

management:
  tracing:
    export:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: false
