x-service: &service
  build:
    context: .
  environment: &env
    KAFKA_BOOTSTRAP: kafka:29092
    DB_USER: saga
    DB_PASSWORD: saga
    OTEL_TRACES_ENDPOINT: http://observability:4318/v1/traces
    OTEL_METRICS_ENDPOINT: http://observability:4318/v1/metrics
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  restart: on-failure

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      retries: 10

  # Grafana + Tempo (traces) + Prometheus (métricas) + Loki + coletor OpenTelemetry em um container
  observability:
    image: grafana/otel-lgtm:0.38.1
    ports:
      - "3000:3000"

  order-service:
    <<: *service
    build:
      context: .
      args: { SERVICE: order-service }
    ports:
      - "8081:8081"
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/orders

  inventory-service:
    <<: *service
    build:
      context: .
      args: { SERVICE: inventory-service }
    ports:
      - "8082:8082"
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/inventory

  payment-service:
    <<: *service
    build:
      context: .
      args: { SERVICE: payment-service }
    ports:
      - "8083:8083"
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/payments

  shipping-service:
    <<: *service
    build:
      context: .
      args: { SERVICE: shipping-service }
    ports:
      - "8084:8084"
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/shipping
