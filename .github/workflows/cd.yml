name: CD

on:
  push:
    branches: [release, master]

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: Imagem Docker (GHCR)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: [{"image": "order-saga-order-service", "service": "order-service"}, {"image": "order-saga-inventory-service", "service": "inventory-service"}, {"image": "order-saga-payment-service", "service": "payment-service"}, {"image": "order-saga-shipping-service", "service": "shipping-service"}]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'master' }}
            type=raw,value=rc,enable=${{ github.ref_name == 'release' }}
            type=sha,prefix=${{ github.ref_name }}-

      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release no GitHub
    if: github.ref_name == 'master'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Criar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v1.0.${{ github.run_number }}" --target "${{ github.sha }}" --generate-notes
